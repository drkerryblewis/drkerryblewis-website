name: Move publish file to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mv publish-index.html index.html
          rm -rf .github
          git config user.name "drkerryblewis"
          git config user.email "drkerryblewis@users.noreply.github.com"
          git add -A
          git commit -m "Called 7 Ch2-4, DEAD END Ch1-12, Fox-style home lead (Oct 28, 2026)" || exit 0
          git push
